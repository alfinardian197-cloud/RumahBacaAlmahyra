<!doctype html>
<html lang="id">

    <meta charset="UTF-8" />

    <meta name="theme-color" content="#087C3B" />

    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link
      rel="icon"
      type="image/png"
      href="/pwa-192x192.png"

    <title>ALMAHYRA App — Rumah Baca Almahyra</title>
    <meta

    <meta name="twitter:card" content="summary_large_image" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

      rel="stylesheet"
    />
    <script>
      (function () {
        try {
          if (localStorage.getItem('almahyra_theme_v1') === 'dark') {
            document.documentElement.classList.add('dark');
            document.documentElement.style.colorScheme = 'dark';
          }
        } catch (e) {}
      })();

  <body class="bg-[#FFFDF6] text-[#10281B] dark:bg-[#091410] dark:text-[#EDF5F0] antialiased selection:bg-[#087C3B] selection:text-white">

    <script type="module" src="/src/main.tsx"></script>
